name: Fallout 1 PS4 Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build PS4 package
        run: |
          docker run --rm --user root             -w /workspace             -v "$GITHUB_WORKSPACE:/workspace"             openorbisofficial/toolchain:latest             bash -c '
              export OPENORBIS="$OO_PS4_TOOLCHAIN"
              export PATH="$OPENORBIS:$OPENORBIS/bin/linux:$PATH"
              cd /workspace
              bash os/ps4/build.sh
            '

      - name: Upload PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: Fallout-1-PS4
          path: "**/*.pkg"
          if-no-files-found: error
